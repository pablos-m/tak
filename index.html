<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.95 user-scalable=no">
  <title>Gra Snake</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background: #121212;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      overflow: hidden;
      flex-direction: column;
    }

    .game-container {
      position: relative;
      text-align: center;
    }

    canvas {
      border: 3px solid #38a1db;
      box-shadow: 0 0 15px rgba(56, 161, 219, 0.5);
    }

    .score {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5rem;
      color: #38a1db;
      text-shadow: 0 0 5px #fff, 0 0 10px #38a1db;
    }

    @keyframes glowing {
      0% { text-shadow: 0 0 5px #38a1db, 0 0 10px #38a1db; }
      50% { text-shadow: 0 0 20px #38a1db, 0 0 30px #38a1db; }
      100% { text-shadow: 0 0 5px #38a1db, 0 0 10px #38a1db; }
    }

    h2 {
      animation: glowing 1.5s infinite alternate;
    }

    .controls {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }

    .arrow-button {
      background-color: #38a1db;
      border: none;
      color: white;
      padding: 20px;
      margin: 5px;
      font-size: 24px;
      cursor: pointer;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      transition: background-color 0.3s;
    }

    .arrow-button:hover {
      background-color: #2c86a4;
    }

    .up, .down {
      font-size: 32px;
    }

    .left, .right {
      font-size: 28px;
    }
        /* Ukryj przyciski na desktopie */
        @media (min-width: 768px) {
      .controls {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <canvas id="snakeGame"></canvas>
    <div class="score">
      <h2>Punkty: <span id="scoreValue">0</span></h2>
    </div>
  </div>

  <div class="controls">
    <button class="arrow-button up" onclick="changeDirectionFromButton('up')">&#8593;</button>
  </div>
  <div class="controls">
    <button class="arrow-button left" onclick="changeDirectionFromButton('left')">&#8592;</button>
    <button class="arrow-button down" onclick="changeDirectionFromButton('down')">&#8595;</button>
    <button class="arrow-button right" onclick="changeDirectionFromButton('right')">&#8594;</button>
  </div>

  <script>
    const canvas = document.getElementById('snakeGame');
    const ctx = canvas.getContext('2d');
    const gridSize = 20; // Wielkość komórek
    const canvasSize = 400; // Rozmiar planszy
    canvas.width = canvas.height = canvasSize;

    let snake = [{ x: 160, y: 160 }];
    let food = spawnFood();
    let dx = gridSize; // Prędkość początkowa (ruch w prawo)
    let dy = 0;
    let score = 0;

    function gameLoop() {
      // Sprawdź, czy gra się nie skończyła
      if (checkGameOver()) return;

      setTimeout(() => {
        clearCanvas();
        moveSnake();
        checkFoodCollision();
        drawSnake();
        drawFood();
        updateScore();
        gameLoop();
      }, 100);
    }

    function clearCanvas() {
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
      ctx.fillStyle = '#38a1db';
      snake.forEach((segment, index) => {
        ctx.fillRect(segment.x, segment.y, gridSize - 1, gridSize - 1);
      });
    }

    function moveSnake() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      snake.unshift(head); // Dodajemy głowę na początek

      // Jeśli wąż nie zjadł jedzenia, usuwamy ostatni segment
      if (!isFoodEaten()) {
        snake.pop();
      }
    }

    function changeDirection(event) {
      if (event.key === 'ArrowUp' && dy === 0) {
        dx = 0;
        dy = -gridSize;
      } else if (event.key === 'ArrowDown' && dy === 0) {
        dx = 0;
        dy = gridSize;
      } else if (event.key === 'ArrowLeft' && dx === 0) {
        dx = -gridSize;
        dy = 0;
      } else if (event.key === 'ArrowRight' && dx === 0) {
        dx = gridSize;
        dy = 0;
      }
    }

    function changeDirectionFromButton(direction) {
      if (direction === 'up' && dy === 0) {
        dx = 0;
        dy = -gridSize;
      } else if (direction === 'down' && dy === 0) {
        dx = 0;
        dy = gridSize;
      } else if (direction === 'left' && dx === 0) {
        dx = -gridSize;
        dy = 0;
      } else if (direction === 'right' && dx === 0) {
        dx = gridSize;
        dy = 0;
      }
    }

    function checkGameOver() {
      const head = snake[0];

      // Zderzenie z krawędzią
      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) {
        alert('Koniec gry!');
        return true;
      }

      // Zderzenie z ciałem węża
      for (let i = 1; i < snake.length; i++) {
        if (head.x === snake[i].x && head.y === snake[i].y) {
          alert('Koniec gry!');
          return true;
        }
      }

      return false;
    }

    function spawnFood() {
      const x = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
      const y = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
      return { x, y };
    }

    function checkFoodCollision() {
      const head = snake[0];
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        food = spawnFood(); // Spawnuje nowe jedzenie
      }
    }

    function isFoodEaten() {
      const head = snake[0];
      return head.x === food.x && head.y === food.y;
    }

    function drawFood() {
      ctx.fillStyle = '#ff6347'; // Kolor jedzenia
      ctx.fillRect(food.x, food.y, gridSize - 1, gridSize - 1);
    }

    function updateScore() {
      document.getElementById('scoreValue').textContent = score;
    }

    // Obsługa klawiatury
    document.addEventListener('keydown', changeDirection);

    // Uruchomienie gry
    gameLoop();
  </script>
</body>
</html>
