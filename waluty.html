<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" user-scalable=no>
  <title>Kalkulator Walutowy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #f7f7f7;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      text-align: center;
    }

    h1 {
      color: #4CAF50;
      font-size: 2rem;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
      place-self: center;
    
    }

    .output-group {
      display: flex;
      margin-bottom: 20px;
      place-self: center;
    }

    input[type="number"], select {
      padding: 10px;
      font-size: 1rem;
      margin-right: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    select {
      width: 120px;
    }

    .arrow {
      font-size: 2rem;
      margin: 0 20px;
    }

    button {
      padding: 10px 20px;
      font-size: 1.1rem;
      border: none;
      background-color: #4CAF50;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
    }

    .error-message {
      color: red;
      font-size: 0.9rem;
      margin-top: 20px;
    }

    #converted-amount {
      width: 200px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Kalkulator Walutowy</h1>
    <div class="converter">
      <div class="input-group">
        <input type="number" id="amount" placeholder="Kwota" />
      </div>
      <div class="output-group">
        <select id="from-currency">
            <!-- Waluty do wyboru -->
        </select>
        <div class="arrow">&#8594;</div>
        <select id="to-currency">
          <!-- Waluty do wyboru -->
        </select>
      </div>
      <button id="convert-button">Przelicz</button>
      <p id="error-message" class="error-message"></p>
      <input type="number" id="converted-amount" readonly />
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const fromCurrencySelect = document.getElementById('from-currency');
      const toCurrencySelect = document.getElementById('to-currency');
      const amountInput = document.getElementById('amount');
      const convertedAmountInput = document.getElementById('converted-amount');
      const errorMessage = document.getElementById('error-message');
      const convertButton = document.getElementById('convert-button');
      
      const currencies = ['USD', 'EUR', 'GBP', 'JPY', 'PLN', 'CHF', 'AUD', 'CAD', 'NZD', 'SEK', 'NOK', 'CNY', 'INR', 'RUB', 'MXN', 'BRL', 'TRY', 'ZAR', 'HKD', 'KRW'];

      // Tworzenie opcji dla selektów
      currencies.forEach(currency => {
        const optionFrom = document.createElement('option');
        optionFrom.value = currency;
        optionFrom.textContent = currency;
        fromCurrencySelect.appendChild(optionFrom);

        const optionTo = document.createElement('option');
        optionTo.value = currency;
        optionTo.textContent = currency;
        toCurrencySelect.appendChild(optionTo);
      });

      // API do pobierania kursów
      const apiUrl = `https://api.exchangerate-api.com/v4/latest/USD`;

      async function getExchangeRates() {
        try {
          const response = await fetch(apiUrl);
          const data = await response.json();
          return data.rates;
        } catch (error) {
          console.error('Error fetching exchange rates:', error);
        }
      }

      convertButton.addEventListener('click', async () => {
        const fromCurrency = fromCurrencySelect.value;
        const toCurrency = toCurrencySelect.value;
        const amount = parseFloat(amountInput.value);
        
        if (!amount || isNaN(amount)) {
          errorMessage.textContent = 'Proszę podać poprawną kwotę!';
          return;
        }

        errorMessage.textContent = '';

        try {
          const rates = await getExchangeRates();
          const conversionRate = rates[toCurrency] / rates[fromCurrency];
          const convertedAmount = (amount * conversionRate).toFixed(2);
          convertedAmountInput.value = convertedAmount;
        } catch (error) {
          errorMessage.textContent = 'Błąd podczas pobierania kursów walut.';
        }
      });
    });
  </script>
</body>
</html>
